# faer's global parallelism defaults to `Par::rayon(0)`, whose degree is the
# size of the Rayon pool at the call; the degree sets how faer splits a
# reduction, so anything that reads it rounds differently per
# pool size. Core code uses the explicit-`Par` helpers in
# `plskit-rs/src/linalg.rs` instead. The list covers every faer 0.24
# high-level entry that reads the global: the solver methods on
# `mat::generic::Mat` (so `Mat`, `MatRef` and `MatMut` alike), the
# decomposition constructors, the `Solve` / `SolveLstsq` / `DenseSolveCore`
# trait methods, and `determinant`. Test modules (oracles, synthetic designs)
# opt out with `#[allow(clippy::disallowed_methods)]`. Operator `*` on faer
# matrices reads the global too but cannot be listed here (it is a trait
# impl); `tests/thread_count_parity.rs` and `tests/corpus.rs` catch it at run
# time by disabling the global.
disallowed-methods = [
    { path = "faer::get_global_parallelism", reason = "degree follows the Rayon pool size; pass an explicit Par (fit::par_fixed or Par::Seq)" },
