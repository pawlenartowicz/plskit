# conda-forge's python 3.15 package does not contain the libpython shared
# library that PythonCall loads (it is a separate `libpython` package there),
# and PythonCall's own constraint admits 3.15. Requiring `libpython` instead
# is not solvable on Julia 1.10, whose libstdc++ cap excludes every build.
[deps]
python = "<3.15"

[pip.deps]
plskit = "==0.7.1"
