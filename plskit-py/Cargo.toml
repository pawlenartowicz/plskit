[package]
name = "plskit-py"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 wrapper for plskit."
publish = false

[lib]
name = "_plskit"
crate-type = ["cdylib"]

[dependencies]
plskit-bind = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
faer = { workspace = true }     # `MatRef`: the row-major view of a C-ordered X

[lints]
workspace = true
