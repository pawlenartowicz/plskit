# Cargo only. github-actions bump infrequently enough to handle manually, and
# the pyproject specs are loose enough that pip dependabot has nothing to
# propose until numpy 3.x ships.
# Security advisories still fire via Dependabot alerts independently of this.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      faer:
        patterns:
          - "faer*"
    ignore:
      # Newer releases need Rust 1.88 (the MSRV is 1.85); zip must also match ndarray-npy's zip 6.
      - dependency-name: sha2
      - dependency-name: zip
