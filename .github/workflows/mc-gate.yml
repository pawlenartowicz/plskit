name: MC calibration gate

# Runs the #[ignore]d Monte-Carlo calibration tests on a weekly schedule
# and on demand, plus a beta-rustc tripwire for upcoming compiler
# regressions. Kept out of ci.yml so the schedule trigger does not fire
# the full per-push CI suite.
#
# What runs: `cargo test -p plskit --release -- --ignored --nocapture`.
# `--ignored` runs ONLY the #[ignore]d tests of every test target of the
# package, and picks up future ones without editing this file. Today that is
# the Monte-Carlo calibration gate (tests/coverage_mc.rs's CI-coverage grid)
# plus three gram_p tools, the diagnostic sweep (tall_shapes_n_over_p_sweep),
# the work-floor benchmark (gram_p_work_floor_benchmark) and the route
# boundary benchmark (gram_p_route_boundary_benchmark, about 25 s), which
# print measurements and assert nothing a running test does not. `--nocapture`
# surfaces the per-cell numbers in the log even on a passing run.
#
# Runtime is substantial (36-cell grid × 200 datasets × 300 boots).
# ubuntu-only is sufficient for a statistical gate.

on:
  schedule:
    - cron: '0 4 * * 0'   # weekly, Sunday 04:00 UTC
  workflow_dispatch:        # manual trigger — run on demand before releases

jobs:
  mc-calibration:
    name: MC calibration (ignored tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ignored MC calibration tests
        run: cargo test -p plskit --release -- --ignored --nocapture

  # Informational: an upstream beta regression shows up here a release
  # cycle early, without blocking merges.
  rust-beta:
    name: Rust beta
    runs-on: ubuntu-latest
    # Overrides rust-toolchain.toml, as in ci.yml's rust-msrv.
    env:
      RUSTUP_TOOLCHAIN: "beta"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --release
