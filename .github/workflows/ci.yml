name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, docs drift and generated-code gates. None of them depend on the OS,
  # so they run once; every other job waits for this one.
  checks:
    name: Checks (fmt, clippy, drift, generated code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # check-profile-sync.py needs tomllib (Python 3.11+).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check docs drift (API surface / result fields)
        run: python3 scripts/check-docs-drift.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify testdata content hashes
        run: python3 scripts/check_corpus_hash.py
      - name: plskit-bind registry matches the Python signatures
        run: |
          cargo run -p plskit-bind --release --bin plskit-bind-dump > "$RUNNER_TEMP/plskit-registry.json"
          python3 scripts/check-bind-registry.py "$RUNNER_TEMP/plskit-registry.json"
      - name: R stubs match a fresh render of the registry
        run: python3 scripts/render-r-stubs.py --dump "$RUNNER_TEMP/plskit-registry.json" --check
      - name: R crate profile and [workspace] table in sync with the workspace
        run: python3 scripts/check-profile-sync.py
      - name: Julia stubs match the plskit-bind registry
        run: python3 scripts/render-jl-stubs.py --dump "$RUNNER_TEMP/plskit-registry.json" --check

  # The engine's numerics are what can differ by OS, so the full Rust suite
  # (doctests included) runs on all three. The wrappers test only their API.
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace --release

  rust-msrv:
    name: Rust 1.85 (MSRV)
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable and outranks `rustup default`, which is
    # all the toolchain action sets; RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --release

  # plskit-py builds against Python's stable ABI (abi3-py311 in plskit-py/Cargo.toml),
  # so one wheel works on 3.11+. The full suite runs on the oldest and newest
  # supported Python on Linux; macOS and Windows only install and smoke-test.
  python-tests:
    name: Python (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: "3.15" }
          - { os: windows-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.python == '3.15' }}
      - name: Install Python deps
        run: pip install pytest numpy
      - name: Build & install plskit
        run: pip install . -v
      - name: Run pytest (Linux)
        if: runner.os == 'Linux'
        run: |
          cd plskit-py
          pytest -v --tb=short
      - name: Smoke test (macOS, Windows)
        if: runner.os != 'Linux'
        run: >-
          python -c "import numpy as np, plskit;
          rng = np.random.default_rng(1);
          X = rng.standard_normal((40, 5)); y = rng.standard_normal(40);
          assert plskit.pls1_fit(X, y, k=2).k_used == 2"

  # R package: R CMD check on Linux; macOS and Windows only install and
  # smoke-test. Builds in dev mode: a cargo config outside the package patches
  # plskit and plskit-bind to this checkout. There is no committed R
  # Cargo.lock until plskit-bind is on crates.io, so dev mode is the only way
  # the package builds.
  r-package:
    name: R package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PLSKIT_TESTDATA: ${{ github.workspace }}/testdata
      PLSKIT_REQUIRE_CORPUS: "1"
      PKG_SYSREQS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust target for Rtools (Windows)
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      # Caches the Linux clippy build and the canary install; R CMD check
      # itself compiles in a temporary copy of the package. Until plskit-bind
      # is on crates.io, rust-cache's `cargo metadata` cannot resolve the pinned
      # crates.io requirements and logs an error; the step still succeeds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plskit-r/src/rust
      - name: Dev-mode cargo config
        shell: bash
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          cfg="$RUNNER_TEMP/plskit-dev.toml"
          printf "[patch.crates-io]\nplskit = { path = '%s/plskit-rs' }\nplskit-bind = { path = '%s/plskit-bind' }\n" "$root" "$root" > "$cfg"
          cat "$cfg"
          echo "PLSKIT_CARGO_CONFIG=$cfg" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: plskit-r
          # roxygen2 pinned to DESCRIPTION's RoxygenNote, so the docs gate
          # below compares against the same generator.
          extra-packages: any::rcmdcheck, roxygen2@7.3.3
          needs: check
      - name: Seam fmt, clippy and dev lock versions (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path plskit-r/src/rust/Cargo.toml --check
          (cd plskit-r/src && Rscript ../tools/cargo-build.R --clippy)
          python3 scripts/check-profile-sync.py --r-lock plskit-r/src/rust/target/dev-crate/Cargo.lock
      - name: Generated R docs are up to date (Linux)
        if: runner.os == 'Linux'
        run: |
          Rscript -e 'roxygen2::roxygenise("plskit-r", roclets = c("rd", "namespace"), load_code = roxygen2::load_source)'
          git status --porcelain -- plskit-r/man plskit-r/NAMESPACE
          test -z "$(git status --porcelain -- plskit-r/man plskit-r/NAMESPACE)"
      - uses: r-lib/actions/check-r-package@v2
        if: runner.os == 'Linux'
        with:
          working-directory: plskit-r
          args: 'c("--no-manual")'
          error-on: '"error"'
          check-dir: '"check"'
      # error-on "error" lets WARNINGs through; the one accepted WARNING is
      # "checking compiled code" (the Rust std library references _abort).
      # Any other WARNING fails here.
      - name: No R CMD check WARNING other than compiled code
        if: runner.os == 'Linux'
        shell: bash
        run: |
          log=plskit-r/check/plskit.Rcheck/00check.log
          test -f "$log"
          if grep -E '\.\.\. WARNING' "$log" | grep -v 'checking compiled code'; then
            echo "::error::unexpected WARNING in $log"
            exit 1
          fi
      # Cross-wrapper bit canary, R half: R against the corpus at atol 0 on
      # the platform that generated the fixtures. Non-blocking.
      - name: Bit canary, R vs the corpus at atol 0 (Linux, non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          PLSKIT_CORPUS_EXACT: "1"
        run: |
          R CMD INSTALL plskit-r
          Rscript -e 'testthat::test_file("plskit-r/tests/testthat/test-corpus.R", package = "plskit", load_package = "installed", reporter = "check")'
      - name: Install and smoke test (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          R CMD INSTALL plskit-r
          Rscript -e 'library(plskit); set.seed(1); X <- matrix(rnorm(200), 40); y <- rnorm(40); stopifnot(pls1_fit(X, y, k = 2)$k_used == 2L)'

  # PLSKit.jl runs the Python package through PythonCall.jl, so this job
  # builds plskit-py into a virtualenv and points PythonCall at it, with
  # CondaPkg switched off. Pkg.test() runs on Linux; macOS and Windows only
  # install and smoke-test.
  julia-tests:
    name: Julia (${{ matrix.os }}, julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, julia: "lts" }
          - { os: ubuntu-latest, julia: "1" }
          - { os: macos-latest, julia: "1" }
          - { os: windows-latest, julia: "1" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # PLSKit.jl pins one plskit-py release. Same version in the tree: build
      # it from source. Tree already newer: test the pinned wheel from PyPI.
      # Tree older than the pin (Julia leading Python): fail.
      - name: Choose the plskit-py the Julia tests run against
        id: pypin
        shell: bash
        run: python scripts/julia-python-pin.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pypin.outputs.mode == 'source'
      - uses: Swatinem/rust-cache@v2
        if: steps.pypin.outputs.mode == 'source'
        with:
          save-if: ${{ matrix.julia == '1' }}
      - name: Install plskit-py into a virtualenv
        shell: bash
        env:
          MODE: ${{ steps.pypin.outputs.mode }}
          PIN: ${{ steps.pypin.outputs.pin }}
        run: |
          python -m venv "$RUNNER_TEMP/jlpy"
          if [ "$RUNNER_OS" = "Windows" ]; then
            source "$RUNNER_TEMP/jlpy/Scripts/activate"
          else
            source "$RUNNER_TEMP/jlpy/bin/activate"
          fi
          if [ "$MODE" = "source" ]; then
            pip install maturin numpy
            maturin develop --release
          else
            pip install "plskit==$PIN"
          fi
          echo "JULIA_PYTHONCALL_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "JULIA_CONDAPKG_BACKEND=Null" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Pkg.test() (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLSKIT_REQUIRE_CORPUS: "1"
        run: julia --color=yes --project=plskit-jl -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Smoke test (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: >-
          julia --color=yes --project=plskit-jl -e 'using Pkg; Pkg.instantiate();
          using PLSKit; X = randn(40, 5); y = randn(40);
          @assert pls1_fit(X, y; k=2).k_used == 2'
