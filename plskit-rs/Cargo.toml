[package]
name = "plskit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PLS regression with modern inference. Rust implementation; the same engine drives the Python, R, and Julia wrappers."
readme = "README.md"
keywords = ["pls", "regression", "chemometrics", "statistics", "multivariate"]
categories = ["science", "mathematics"]

[dependencies]
faer = { workspace = true }
commonstats = { workspace = true }
getrandom = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[features]
# Records the route every loop takes (`route_select::take_routes`), for
# `tests/memory_bound.rs`. Off by default; the dev-dependency on this crate
# below turns it on for the tests only.
route-log = []

[dev-dependencies]
plskit = { path = ".", features = ["route-log"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
approx = "0.5"
serde_json = "1"                # corpus test reader
ndarray = "0.17"                # test-only: corpus reader feeds ndarray-npy
ndarray-npy = "0.11"            # test-only: load .npz fixtures

[lints]
workspace = true
